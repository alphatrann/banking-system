apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
  namespace: banking-system
spec:
  ingressClassName: nginx
  rules:
    - host: api.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-service
                port:
                  number: 80
